name: Release-plz

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  validation:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release-plz-pr:
    name: Release-plz PR
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libsystemd-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.NEARPROTOCOL_CI_PR_ACCESS }}

  release-plz-release:
    name: Release-plz release
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    # Never cancel an in-flight publish — half-published releases are worse than waiting.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libsystemd-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release)
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.NEARPROTOCOL_CI_PR_ACCESS }}

      - name: Attest build provenance
        if: steps.release-plz.outputs.releases_created == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: target/package/**/*.crate
